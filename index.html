<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>สหกรณ์โรงเรียนสถาพรศึกษา — เครื่องแบบ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --paper:#EAF4FB;
    --paper-dark:#D6EAF7;
    --ink:#20374F;
    --ink-soft:#5E7C93;
    --stamp:#1E70B8;
    --stamp-dark:#155A94;
    --teal:#2C7BB0;
    --teal-dark:#1F5F8C;
    --line:#BEDCEF;
    --out:#AFC9DB;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    font-family:'IBM Plex Sans Thai',sans-serif;
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
  }
  .app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:96px;position:relative;}

  header{
    padding:22px 18px 14px;
    background:var(--paper);
    border-bottom:1px dashed var(--line);
    position:sticky; top:0; z-index:5;
  }
  header .htop{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  header .sigil{width:52px; height:52px; flex-shrink:0; margin-top:2px; object-fit:contain;}
  header .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:14px; letter-spacing:.03em; text-transform:uppercase;
    color:var(--stamp); font-weight:600; line-height:1.3;
  }
  header h1{margin:2px 0 2px; font-size:22px; font-weight:700; letter-spacing:.01em;}
  header .date{font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--ink-soft);}
  .date-row{display:flex; align-items:center; justify-content:space-between; margin-top:2px;}
  .refresh-btn{
    background:none; border:1px solid var(--line); border-radius:20px; padding:4px 10px;
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--teal-dark); cursor:pointer;
  }
  .refresh-btn:active{background:var(--paper-dark);}
  .name-row{display:flex; align-items:center; gap:8px; margin-top:10px;}
  .name-label{font-size:12px; color:var(--ink-soft); flex-shrink:0;}
  .name-input{
    flex:1; font-family:'IBM Plex Sans Thai',sans-serif; font-size:13px; padding:6px 10px;
    border:1px solid var(--line); border-radius:8px; background:#fff;
  }
  .name-save-btn{
    flex-shrink:0; background:var(--teal); color:#fff; border:none; border-radius:8px;
    padding:7px 12px; font-size:12.5px; font-weight:600; cursor:pointer;
    font-family:'IBM Plex Sans Thai',sans-serif;
  }
  .name-save-btn:active{background:var(--teal-dark);}

  .tabs{display:flex; gap:6px; padding:12px 18px 0; background:var(--paper);}
  .tab{
    flex:1; text-align:center; padding:9px 4px; border-radius:8px 8px 0 0;
    font-size:13px; font-weight:600; color:var(--ink-soft);
    border:1px solid transparent; cursor:pointer; user-select:none;
  }
  .tab.active{background:var(--paper-dark); color:var(--ink); border:1px dashed var(--line); border-bottom:none;}

  main{padding:16px 18px 8px;}
  .hidden{display:none !important;}

  .cat-nav{display:flex; gap:6px; overflow-x:auto; padding-bottom:8px;}
  .cat-chip{
    flex:none; font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.06em;
    text-transform:uppercase; color:var(--teal-dark); background:#fff; border:1px solid var(--line);
    border-radius:999px; padding:6px 11px; cursor:pointer; white-space:nowrap;
  }
  .cat-chip.active{background:var(--teal); border-color:var(--teal); color:#fff;}
  .filter-panel{margin-bottom:8px;}
  .filter-group{margin-bottom:2px;}
  .filter-group-label{
    font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--ink-soft); margin:8px 0 5px;
  }
  .clear-filter-btn{
    display:block; margin:6px 0 2px; background:none; border:1px dashed var(--out); border-radius:8px;
    padding:6px 10px; font-size:11px; color:var(--ink-soft); cursor:pointer;
    font-family:'IBM Plex Sans Thai',sans-serif;
  }

  .cat-label{
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--teal-dark); margin:18px 0 3px; font-weight:600; scroll-margin-top:190px;
  }
  .cat-label:first-child{margin-top:4px;}
  .cat-sub{font-size:11px; color:var(--ink-soft); margin:0 0 8px;}

  .grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
  .item-btn{
    position:relative;
    background:#fff; border:1px solid var(--line); border-radius:10px;
    padding:10px 6px 9px; text-align:center; cursor:pointer;
    display:flex; flex-direction:column; gap:2px;
    transition:transform .06s ease, box-shadow .06s ease;
  }
  .item-btn:active{transform:scale(.97);}
  .item-btn .name{font-size:14.5px; font-weight:600; line-height:1.25;}
  .item-btn .price{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft);}
  .item-btn .stockline{font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--ink-soft); margin-top:1px;}
  .item-btn .stockline.low{color:#B8791E; font-weight:600;}
  .item-btn .stockline.out{color:var(--stamp); font-weight:600;}
  .item-btn .badge{
    position:absolute; top:-7px; right:-7px; min-width:22px; height:22px; padding:0 5px;
    background:var(--stamp); color:#fff; border-radius:20px;
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:700;
    box-shadow:0 1px 3px rgba(0,0,0,.25);
  }
  .item-btn.out{opacity:.4; pointer-events:none;}

  /* Receipt / cart */
  .receipt{
    margin-top:22px; background:#fff; border:1px solid var(--line); border-radius:12px;
    padding:14px 16px 10px; box-shadow:0 1px 0 var(--line);
  }
  .receipt-title{
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--ink-soft); display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;
  }
  .receipt-title button{
    background:none; border:none; color:var(--stamp); font-family:'IBM Plex Mono',monospace;
    font-size:11px; cursor:pointer; padding:2px 0;
  }
  .cart-empty{text-align:center; color:var(--ink-soft); font-size:13px; padding:18px 0; font-family:'IBM Plex Mono',monospace;}
  .cart-row{display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px dotted var(--line); font-size:13.5px;}
  .cart-row:last-of-type{border-bottom:none;}
  .cart-row .cname{flex:1;}
  .cart-row .cname .sub{color:var(--ink-soft); font-size:11px;}
  .cart-row .qty-ctrl{display:flex; align-items:center; gap:6px; font-family:'IBM Plex Mono',monospace;}
  .qty-ctrl button{
    width:22px; height:22px; border-radius:6px; border:1px solid var(--line); background:var(--paper);
    font-size:14px; line-height:1; cursor:pointer; color:var(--ink);
  }
  .cart-row .csub{width:56px; text-align:right; font-family:'IBM Plex Mono',monospace; font-size:13px;}

  .pay-row{display:flex; gap:8px; margin-top:12px;}
  .pay-chip{
    flex:1; text-align:center; padding:8px; border-radius:8px; border:1px solid var(--line);
    background:var(--paper); font-family:'IBM Plex Sans Thai',sans-serif; font-size:12.5px;
    color:var(--ink-soft); cursor:pointer; font-weight:600;
  }
  .pay-chip.active{background:var(--teal); border-color:var(--teal); color:#fff;}

  .total-row{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-top:10px; padding-top:10px; border-top:1.5px dashed var(--ink);
  }
  .total-row .label{font-size:13px; color:var(--ink-soft); font-weight:600;}
  .total-row .amount{font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:700; color:var(--stamp);}

  .save-btn{
    width:100%; margin-top:14px; padding:13px; border:none; border-radius:10px;
    background:var(--teal); color:#fff; font-size:15px; font-weight:700;
    font-family:'IBM Plex Sans Thai',sans-serif; cursor:pointer;
  }
  .save-btn:disabled{background:var(--out); cursor:default;}
  .save-btn:active:not(:disabled){background:var(--teal-dark);}

  .toast{
    position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:30px;
    font-size:13px; font-family:'IBM Plex Mono',monospace; opacity:0; transition:all .25s ease; z-index:50;
    pointer-events:none; white-space:nowrap;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* Summary */
  .summary-toolbar{display:flex; gap:8px; margin-bottom:12px;}
  .summary-toolbar input[type=date]{
    flex:1; font-family:'IBM Plex Sans Thai',sans-serif; font-size:13px; padding:8px 10px;
    border:1px solid var(--line); border-radius:8px; background:#fff;
  }
  .stat-row{display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap;}
  .stat-card{flex:1; min-width:44%; background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px 14px;}
  .stat-card .k{font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft);}
  .stat-card .v{font-family:'IBM Plex Mono',monospace; font-size:19px; font-weight:700; margin-top:3px;}

  .day-card{background:#fff; border:1px solid var(--line); border-radius:10px; margin-bottom:10px; overflow:hidden;}
  .day-head{display:flex; justify-content:space-between; align-items:center; padding:11px 14px; cursor:pointer;}
  .day-head .d{font-weight:600; font-size:13px;}
  .day-head .t{font-family:'IBM Plex Mono',monospace; font-size:13.5px; color:var(--stamp); font-weight:700;}
  .day-body{padding:0 14px 12px; display:none; border-top:1px dotted var(--line);}
  .day-body.open{display:block;}
  .day-line{display:flex; justify-content:space-between; font-size:12.5px; padding:5px 0; color:var(--ink-soft);}
  .day-line span:last-child{font-family:'IBM Plex Mono',monospace;}
  .time-log-label{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.08em;
    color:var(--teal-dark); margin:12px 0 6px; padding-top:8px; border-top:1px dashed var(--line);
  }
  .time-log-row{padding:6px 0; border-bottom:1px dotted var(--line); position:relative;}
  .time-log-row:last-child{border-bottom:none;}
  .time-log-row .tl-top{display:flex; justify-content:space-between; font-size:12px; padding-right:26px;}
  .time-log-row .tl-time{font-family:'IBM Plex Mono',monospace; color:var(--ink); font-weight:600;}
  .time-log-row .tl-seller{color:var(--ink-soft); font-size:11.5px;}
  .time-log-row .tl-items{font-size:11.5px; color:var(--ink-soft); margin-top:2px; padding-right:26px;}
  .time-log-row .tl-actions{display:flex; gap:8px; margin-top:6px;}
  .tl-quick-edit{
    position:absolute; top:4px; right:0; width:22px; height:22px; border-radius:50%;
    border:1px solid var(--line); background:#fff; color:var(--teal-dark); font-size:11px;
    cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;
  }
  .tl-quick-edit:active{background:var(--paper-dark);}
  .se-field-row{display:flex; gap:10px; margin-bottom:10px;}
  .se-field-row > div{flex:1;}
  .time-log-row .tl-actions button{
    font-size:11px; padding:4px 9px; border-radius:7px; border:1px solid var(--line);
    background:var(--paper); cursor:pointer; font-family:'IBM Plex Sans Thai',sans-serif; color:var(--ink-soft);
  }
  .day-copy-btn{
    width:100%; margin-top:12px; padding:9px; border-radius:8px; border:1px dashed var(--teal);
    background:none; color:var(--teal-dark); font-weight:600; font-size:12px; cursor:pointer;
    font-family:'IBM Plex Sans Thai',sans-serif;
  }
  .export-row{display:flex; gap:8px; margin-top:6px;}
  .export-btn{
    flex:1; padding:12px; border-radius:10px; border:1px dashed var(--teal);
    background:none; color:var(--teal-dark); font-weight:600; font-size:13px; cursor:pointer;
    font-family:'IBM Plex Sans Thai',sans-serif;
  }
  .btn-xlsx{background:var(--teal); color:#fff; border:1px solid var(--teal) !important;}

  .empty-note{text-align:center; color:var(--ink-soft); font-size:13px; padding:40px 10px; font-family:'IBM Plex Mono',monospace;}

  /* Stock */
  .stock-cat{margin-bottom:16px;}
  .stock-cat-head{display:flex; justify-content:space-between; align-items:center; margin:14px 0 6px;}
  .stock-cat-head h4{
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--teal-dark); margin:0; font-weight:600;
  }
  .stock-cat-head .meta{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft);}
  .stock-row{
    display:flex; align-items:center; justify-content:space-between; background:#fff;
    border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:7px; gap:8px;
  }
  .stock-row .info{flex:0 0 46px;}
  .stock-row .info .n{font-size:14px; font-weight:700;}
  .stock-row .fields{flex:1; display:flex; gap:6px;}
  .stock-row .fields .f{flex:1;}
  .stock-row .fields label{
    display:block; font-family:'IBM Plex Mono',monospace; font-size:9px; text-transform:uppercase;
    color:var(--ink-soft); margin-bottom:2px; letter-spacing:.04em;
  }
  .stock-row .fields input{
    width:100%; font-family:'IBM Plex Mono',monospace; font-size:12.5px; padding:6px 6px;
    border:1px solid var(--line); border-radius:7px; background:var(--paper); text-align:center;
  }
  .stock-row .sold{width:44px; text-align:center; font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft);}

  .lock-banner{
    background:#fff; border:1px dashed var(--out); border-radius:10px; padding:16px;
    text-align:center; margin-bottom:14px;
  }
  .lock-banner .li{font-size:24px; margin-bottom:4px;}
  .lock-banner p{font-size:12.5px; color:var(--ink-soft); margin:2px 0 10px;}
  .lock-banner button{
    background:var(--teal); color:#fff; border:none; border-radius:8px; padding:9px 20px;
    font-weight:600; font-size:13px; cursor:pointer; font-family:'IBM Plex Sans Thai',sans-serif;
  }
  .relock-row{display:flex; justify-content:flex-end; margin-bottom:10px;}
  .relock-btn{
    background:none; border:1px solid var(--line); border-radius:20px; padding:5px 12px;
    font-size:11.5px; color:var(--ink-soft); cursor:pointer; font-family:'IBM Plex Mono',monospace;
  }
  .admin-hint{font-size:11px; color:var(--ink-soft); margin-bottom:12px; font-family:'IBM Plex Sans Thai',sans-serif;}

  /* Modal */
  .modal-back{position:fixed; inset:0; background:rgba(43,38,32,.55); z-index:60; display:flex; align-items:flex-end;}
  .modal{
    background:var(--paper); width:100%; max-width:480px; margin:0 auto; border-radius:16px 16px 0 0;
    padding:18px 18px 22px; max-height:80vh; overflow:auto;
  }
  .modal h3{margin:0 0 4px; font-size:16px;}
  .modal p{margin:0 0 10px; font-size:12.5px; color:var(--ink-soft);}
  .admin-code-input{
    width:100%; font-family:'IBM Plex Sans Thai',sans-serif; font-size:15px;
    border:1px solid var(--line); border-radius:8px; padding:11px; background:#fff;
  }
  .modal-actions{display:flex; gap:8px; margin-top:10px;}
  .modal-actions button{
    flex:1; padding:11px; border-radius:9px; border:none; font-weight:600; font-size:13.5px; cursor:pointer;
    font-family:'IBM Plex Sans Thai',sans-serif;
  }
  .btn-copy{background:var(--teal); color:#fff;}
  .btn-close{background:var(--paper-dark); color:var(--ink); border:1px solid var(--line) !important;}
  .btn-danger{background:var(--stamp); color:#fff;}

  .date-pick-list{display:flex; flex-direction:column; gap:6px; max-height:280px; overflow:auto;}
  .date-pick-btn{
    text-align:left; padding:11px 14px; border-radius:9px; border:1px solid var(--line);
    background:var(--paper); font-family:'IBM Plex Sans Thai',sans-serif; font-size:13.5px;
    color:var(--ink); cursor:pointer;
  }
  .date-pick-btn.all{border:1px dashed var(--stamp); color:var(--stamp-dark); font-weight:600;}

  .add-item-btn{
    width:100%; padding:11px; margin:10px 0 14px; border-radius:10px; border:1px dashed var(--teal);
    background:none; color:var(--teal-dark); font-weight:600; font-size:13.5px; cursor:pointer;
    font-family:'IBM Plex Sans Thai',sans-serif;
  }
  .admin-row{display:flex; gap:8px; margin-top:8px;}
  .admin-row button{
    flex:1; padding:11px; border-radius:9px; font-weight:600; font-size:12.5px; cursor:pointer;
    font-family:'IBM Plex Sans Thai',sans-serif; border:1px solid var(--line); background:#fff;
  }
  .admin-row .clear-btn{color:var(--stamp); border-color:var(--stamp);}
  .admin-row .edit-btn{color:var(--teal-dark); border-color:var(--teal);}

  .edit-mode-note{
    display:flex; justify-content:space-between; align-items:center;
    background:#fff; border:1px dashed var(--teal); border-radius:10px; padding:10px 14px; margin-bottom:10px;
  }
  .edit-mode-note span{font-size:12.5px; color:var(--teal-dark); font-weight:600;}
  .edit-mode-note button{
    background:none; border:1px solid var(--line); border-radius:20px; padding:5px 12px;
    font-size:11.5px; color:var(--ink-soft); cursor:pointer; font-family:'IBM Plex Mono',monospace;
  }
  .sale-entry{
    background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:8px;
  }
  .sale-entry .se-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; gap:8px;}
  .sale-entry .se-meta{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft);}
  .sale-entry .se-total{font-family:'IBM Plex Mono',monospace; font-size:13.5px; font-weight:700; color:var(--stamp); flex-shrink:0;}
  .sale-entry .se-items{font-size:12px; color:var(--ink-soft); margin-bottom:6px;}
  .se-actions{display:flex; gap:8px; margin-top:6px;}
  .se-editbtn{
    background:none; border:1px solid var(--teal); color:var(--teal-dark); border-radius:7px;
    padding:5px 10px; font-size:11.5px; cursor:pointer; font-family:'IBM Plex Sans Thai',sans-serif;
  }
  .se-del{
    background:none; border:1px solid var(--stamp); color:var(--stamp); border-radius:7px;
    padding:5px 10px; font-size:11.5px; cursor:pointer; font-family:'IBM Plex Sans Thai',sans-serif;
  }
  .sale-editor{
    background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 16px 10px;
  }
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <div class="htop">
      <div class="htext">
        <div class="eyebrow">สหกรณ์โรงเรียนสถาพรศึกษา</div>
        <h1>เครื่องแบบนักเรียน</h1>
      </div>
      <img class="sigil" id="sigilImg" alt="ตราโรงเรียน">
    </div>
    <div class="date-row">
      <div class="date" id="todayLabel"></div>
      <button class="refresh-btn" id="refreshBtn" title="ดึงข้อมูลล่าสุด">⟳ รีเฟรช</button>
    </div>
    <div class="name-row">
      <span class="name-label">ผู้ขาย:</span>
      <input type="text" id="myNameInput" class="name-input" list="namesList" placeholder="พิมพ์หรือเลือกชื่อ">
      <datalist id="namesList"></datalist>
      <button class="name-save-btn" id="saveNameBtn">บันทึก</button>
    </div>
  </header>

  <div class="tabs">
    <div class="tab active" data-tab="sell">ขายของ</div>
    <div class="tab" data-tab="summary">สรุปยอด</div>
    <div class="tab" data-tab="stock">สต็อก</div>
  </div>

  <main>
    <section id="tab-sell"></section>
    <section id="tab-summary" class="hidden"></section>
    <section id="tab-stock" class="hidden"></section>
  </main>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot,
  collection, getDocs, addDoc, runTransaction, increment, serverTimestamp,
  query, where
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

/* Same Firebase project as the stationery shop app — separate top-level
   collections (uniform_*) keep the data apart. */
const firebaseConfig = {

function todayKey(){
  const d = new Date();
  const tz = new Date(d.getTime() - d.getTimezoneOffset()*60000);
  return tz.toISOString().slice(0,10);
}
function nowTime(){
  return new Date().toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'});
}
function baht(n){ return '฿' + (Number(n)||0).toLocaleString('th-TH', {maximumFractionDigits:2}); }
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove('show'), 2200);
}
function todayLabelText(){

async function ensureSeeded(){
  const seededRef = doc(db,'meta','uniform_seeded');
  const s = await getDoc(seededRef);
  if (s.exists()) return;
  for (const cat of CATEGORIES){
    for (const size of cat.sizes){
      const id = pid(cat.key,size);
      const ref = doc(db,'uniform_products',id);
      const ex = await getDoc(ref);
      if (!ex.exists()){
        const seed = SEED_DATA[id] || { p:0, r:0 };
        await setDoc(ref, { category:cat.key, categoryLabel:cat.label, categorySub:cat.sub, size, price:seed.p, received:seed.r, remaining:seed.r });
      }
    }
  }
  await setDoc(seededRef, { done:true });
}

function stockClass(remaining){
  if (remaining<=0) return 'out';
  if (remaining<=LOW_STOCK) return 'low';
  return '';
}
function cartIds(){ return Object.keys(cart).filter(id=>!id.startsWith('__') && cart[id]>0); }
function cartTotal(){
  return cartIds().reduce((s,id)=> s + (PRODUCTS[id]?.price||0) * cart[id], 0);
}

function categoryVisible(cat){
  if (filterCats.size && !filterCats.has(cat.key)) return false;
  if (filterOutfits.size && !filterOutfits.has(cat.outfit)) return false;
  if (filterGenders.size && !cat.genders.some(g=>filterGenders.has(g))) return false;
  return true;
}
function anyFilterActive(){
  return filterCats.size || filterOutfits.size || filterGenders.size;
}

    <div class="filter-group">
      <div class="filter-group-label">ประเภทชุด</div>
      <div class="cat-nav">`;

  html += `</div></div>
    <div class="filter-group">
      <div class="filter-group-label">เพศ</div>
      <div class="cat-nav">`;
  GENDER_GROUPS.forEach(g=> html += `<div class="cat-chip ${filterGenders.has(g.key)?'active':''}" data-filter="gender" data-val="${g.key}">${g.label}</div>`);
  html += `</div></div>`;

  html += `</div>`;

  const visibleCats = CATEGORIES.filter(categoryVisible);
  if (!visibleCats.length){
    html += `<div class="empty-note">ไม่มีสินค้าตรงกับตัวกรองที่เลือก</div>`;
  }
  visibleCats.forEach(cat=>{
    html += `<div class="cat-label">${cat.label}</div><div class="cat-sub">${cat.sub}</div><div class="grid">`;
    cat.sizes.forEach(size=>{
      const id = pid(cat.key,size);
      const p = PRODUCTS[id] || {price:0, remaining:0};
      const qty = cart[id]||0;
      const sCls = stockClass(p.remaining);

      html += `

        </div>`;
    });

  });

  const ids = cartIds();
  html += `<div class="receipt">
    <div class="receipt-title"><span>รายการที่เลือก</span>${ids.length?'<button id="clearCart">ล้าง</button>':''}</div>`;
  if (!ids.length){
    html += `<div class="cart-empty">แตะที่สินค้าเพื่อเพิ่มลงรายการ</div>`;
  } else {
    ids.forEach(id=>{
      const p = PRODUCTS[id];
      const qty = cart[id];
      html += `<div class="cart-row">
        <div class="cname">${p.categoryLabel}<div class="sub">ไซส์ ${p.size} · ${baht(p.price)}/ชิ้น</div></div>

        <div class="csub">${baht(p.price*qty)}</div>
      </div>`;
    });
    html += `<div class="pay-row">
      <div class="pay-chip ${cart.__pay!=='โอน'?'active':''}" data-pay="สด">💵 สด</div>
      <div class="pay-chip ${cart.__pay==='โอน'?'active':''}" data-pay="โอน">📱 โอน</div>

      <label class="small">รหัสนักเรียน</label>

    </div>`;
    html += `<div class="total-row"><div class="label">รวมทั้งสิ้น</div><div class="amount">${baht(cartTotal())}</div></div>`;
  }
  html += `<button class="save-btn" id="saveSaleBtn" ${ids.length?'':'disabled'}>บันทึกการขาย</button>
  </div>`;

  el.innerHTML = html;
  if (resetScrollNext){ window.scrollTo(0,0); resetScrollNext = false; }
  else window.scrollTo(0, scrollY);

  el.querySelectorAll('.cat-chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      const set = chip.dataset.filter==='cat' ? filterCats : chip.dataset.filter==='outfit' ? filterOutfits : filterGenders;
      const val = chip.dataset.val;
      if (set.has(val)) set.delete(val); else set.add(val);

      renderSell();
    });
  });
  const clearBtn2 = document.getElementById('clearFiltersBtn');
  if (clearBtn2) clearBtn2.addEventListener('click', ()=>{

  });
  el.querySelectorAll('.item-btn').forEach(btn=>{

      cart[id] = (cart[id]||0)+1;
      renderSell();
    });
  });
  el.querySelectorAll('[data-plus]').forEach(b=>b.addEventListener('click',()=>{ cart[b.dataset.plus]++; renderSell(); }));
  el.querySelectorAll('[data-minus]').forEach(b=>b.addEventListener('click',()=>{
    const id = b.dataset.minus; cart[id]--; if (cart[id]<=0) delete cart[id]; renderSell();
  }));
  el.querySelectorAll('[data-pay]').forEach(b=>b.addEventListener('click',()=>{ cart.__pay = b.dataset.pay; renderSell(); }));
  const codeInput = document.getElementById('studentCodeInput');
  if (codeInput) codeInput.addEventListener('input', e=>{ cart.__studentCode = e.target.value; });
  const clearBtn = document.getElementById('clearCart');
  if (clearBtn) clearBtn.addEventListener('click', ()=>{ cart = {}; renderSell(); });
  const saveBtn = document.getElementById('saveSaleBtn');
  if (saveBtn) saveBtn.addEventListener('click', saveSale);
}

async function saveSale(){
  if (!myName){ toast('กรุณากรอกชื่อผู้ขายก่อน'); return; }
  const studentCode = (cart.__studentCode||'').trim();
  if (!studentCode){ toast('กรุณากรอกรหัสนักเรียนก่อนบันทึก'); return; }
  const ids = cartIds();
  if (!ids.length) return;
  const btn = document.getElementById('saveSaleBtn');
  btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
  try{
    await readyPromise;
    const items = ids.map(id=>{
      const p = PRODUCTS[id];
      const qty = cart[id];
      return { productId:id, category:p.category, categoryLabel:p.categoryLabel, size:p.size, price:p.price, qty, subtotal:p.price*qty };
    });
    const total = items.reduce((s,it)=>s+it.subtotal,0);
    for (const it of items){
      await updateDoc(doc(db,'uniform_products',it.productId), { remaining: increment(-it.qty) });
    }
    await addDoc(collection(db,'uniform_transactions'), {
      date: todayKey(), time: nowTime(), seller: myName, payment: cart.__pay || 'สด', studentCode,
      items, total, createdAt: serverTimestamp()
    });
    cart = {};
    renderSell();
    toast('บันทึกการขายแล้ว ' + baht(total));
  } catch(err){
    console.error(err);
    toast('เกิดข้อผิดพลาด กรุณาลองใหม่');
  } finally {
    btn.disabled = false;
  }
}

/* Adjust product stock to reflect the difference between a transaction's
   original items and its edited items (called when saving an edit). */
async function applyStockDelta(originalItems, finalItems){
  const orig = {}; (originalItems||[]).forEach(i=>{ orig[i.productId] = (orig[i.productId]||0) + i.qty; });
  const fin = {}; (finalItems||[]).forEach(i=>{ fin[i.productId] = (fin[i.productId]||0) + i.qty; });
  const ids = new Set([...Object.keys(orig), ...Object.keys(fin)]);
  for (const id of ids){
    const delta = (fin[id]||0) - (orig[id]||0); // positive = sold more -> decrement stock further
    if (delta !== 0){
      try{ await updateDoc(doc(db,'uniform_products',id), { remaining: increment(-delta) }); }catch(e){}
    }
  }
}

        <div class="pay-chip ${editingSaleMeta.payment==='โอน'?'active':''}" data-se-pay="โอน">📱 โอน</div>
      </div>
    </div>`;
    if (!editingSaleItems || !editingSaleItems.length){
      html += `<div class="empty-note">ไม่มีสินค้าในรายการนี้</div>`;
    } else {
      editingSaleItems.forEach((i,idx)=>{
        html += `<div class="cart-row">
          <div class="cname">${i.categoryLabel}<div class="sub">ไซส์ ${i.size} · ${baht(i.price)}/ชิ้น</div></div>
          <div class="qty-ctrl">
            <button data-se-dec="${idx}">−</button><span>${i.qty}</span><button data-se-inc="${idx}">+</button>
          </div>
          <div class="csub">${baht(i.price*i.qty)}</div>
        </div>`;
      });
    }
    html += `<button class="add-item-btn" id="seAddItem">+ เพิ่มสินค้า</button>`;
    html += `<div class="total-row"><div class="label">รวมทั้งสิ้น</div><div class="amount">${baht(liveTotal)}</div></div>`;
    html += `<button class="save-btn" id="seSaveEdit">บันทึกการแก้ไข</button>`;
    html += `</div>`;
  } else if (editDataMode){
    const dk = editDataMode === '__all__' ? null : editDataMode;
    const scoped = dk ? allTransactions.filter(t=>t.date===dk) : allTransactions;
    const label = dk || 'ทุกวันที่ผ่านมา';
    html += `<div class="edit-mode-note"><span>โหมดแก้ไข — ${label}</span><button id="closeEditMode">ปิดโหมดนี้</button></div>`;
    const sorted = [...scoped].sort((a,b)=> (b.date+' '+b.time).localeCompare(a.date+' '+a.time));
    if (!sorted.length){
      html += `<div class="empty-note">ไม่มีรายการขายในช่วงที่เลือก</div>`;
    } else {
      sorted.forEach(t=>{
        const itemsStr = (t.items||[]).map(i=>`${i.categoryLabel} ไซส์ ${i.size} x${i.qty}`).join(', ');
        html += `<div class="sale-entry">
          <div class="se-top">
            <span class="se-meta">${t.date} · ${t.time}${t.seller?' · '+escapeHtml(t.seller):''}${t.studentCode?' · รหัส '+escapeHtml(t.studentCode):''}</span>
            <span class="se-total">${baht(t.total)}</span>
          </div>
          <div class="se-items">${itemsStr}</div>
          <div class="se-actions">
            <button class="se-editbtn" data-editsale="${t.id}">✎ แก้ไขรายการ</button>
            <button class="se-del" data-sale="${t.id}">🗑 ลบทั้งหมด</button>
          </div>
        </div>`;
      });
    }
  } else {
    const byDay = {};
    allTransactions.forEach(t=>{
      if (!byDay[t.date]) byDay[t.date] = { total:0, items:{} };
      byDay[t.date].total += (t.total||0);
      (t.items||[]).forEach(i=>{
        const key = i.categoryLabel + ' #' + i.size;
        byDay[t.date].items[key] = byDay[t.date].items[key] || { qty:0, sub:0 };
        byDay[t.date].items[key].qty += i.qty;
        byDay[t.date].items[key].sub += i.subtotal;
      });
    });
    const days = Object.keys(byDay).sort().reverse();
    if (!days.length){
      html += `<div class="empty-note">ยังไม่มีรายการขาย</div>`;
    } else {
      days.forEach(dk=>{
        const d = byDay[dk];
        const open = openDay===dk;
        const daySales = allTransactions.filter(t=>t.date===dk).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
        html += `<div class="day-card">
          <div class="day-head" data-day="${dk}"><span class="d">${dk}</span><span class="t">${baht(d.total)}</span></div>
          <div class="day-body ${open?'open':''}">
            ${Object.keys(d.items).map(n=>`<div class="day-line"><span>${n} ×${d.items[n].qty}</span><span>${baht(d.items[n].sub)}</span></div>`).join('')}
            <div class="time-log-label">บันทึกเวลาการขาย (${daySales.length} รายการ)</div>
            ${daySales.map(t=>{
              const seller = t.seller || 'ไม่ระบุชื่อ';
              const itemsStr = (t.items||[]).map(i=>`${i.categoryLabel} #${i.size} x${i.qty}`).join(', ');
              return `<div class="time-log-row">
                <button class="tl-quick-edit" data-quickedit="${t.id}" title="แก้ไขรายการนี้">✎</button>
                <div class="tl-top"><span class="tl-time">🕐 ${t.time||''}</span><span class="tl-seller">${escapeHtml(seller)} · ${t.payment||'สด'}${t.studentCode?' · รหัส '+escapeHtml(t.studentCode):''}</span></div>
                <div class="tl-items">${itemsStr}</div>
              </div>`;
            }).join('')}
            <button class="day-copy-btn" data-copyday="${dk}">📋 คัดลอกข้อมูลวันนี้ (${dk})</button>
            <button class="day-copy-btn btn-xlsx" data-xlsxday="${dk}" style="margin-top:8px;">⬇️ Excel (${dk})</button>
          </div>
        </div>`;
      });
    }
    html += `<div class="admin-row">
      <button class="edit-btn" id="editDataBtn">แก้ไขข้อมูล</button>
      <button class="clear-btn" id="clearDataBtn">ลบข้อมูล</button>
    </div>`;
  }

  el.innerHTML = html;

  el.querySelectorAll('.day-head').forEach(h=>h.addEventListener('click', ()=>{
    const dk = h.dataset.day;
    openDay = openDay===dk ? null : dk;
    renderSummary();
  }));
  el.querySelectorAll('[data-copyday]').forEach(b=>b.addEventListener('click', e=>{
    e.stopPropagation();
    copyDayText(b.dataset.copyday);
  }));
  el.querySelectorAll('[data-xlsxday]').forEach(b=>b.addEventListener('click', e=>{
    e.stopPropagation();
    downloadXlsx(b.dataset.xlsxday);
  }));
  el.querySelectorAll('[data-quickedit]').forEach(b=>b.addEventListener('click', e=>{
    e.stopPropagation();
    const t = allTransactions.find(x=>x.id===b.dataset.quickedit);
    if (!t) return;
    requireAdmin(()=> openSaleEditor(t));
  }));

  const editBtn = document.getElementById('editDataBtn');
  if (editBtn) editBtn.addEventListener('click', ()=>{
    requireAdmin(()=>{
      const dateKeys = [...new Set(allTransactions.map(t=>t.date))].sort().reverse();
      openDatePicker('เลือกวันที่ต้องการแก้ไข', dateKeys, (dk)=>{ editDataMode = dk || '__all__'; renderSummary(); }, true);
    });
  });
  const clearBtn = document.getElementById('clearDataBtn');
  if (clearBtn) clearBtn.addEventListener('click', ()=>{
    requireAdmin(()=>{
      const dateKeys = [...new Set(allTransactions.map(t=>t.date))].sort().reverse();
      openDatePicker('เลือกวันที่ต้องการลบ', dateKeys, (dk)=>{
        const label = dk || 'ทุกวันที่ผ่านมา';
        openConfirm('ยืนยันการลบ', `ลบข้อมูลการขายของ "${label}" ทั้งหมด? สต็อกจะถูกคืนกลับให้อัตโนมัติ และย้อนกลับไม่ได้`, async ()=>{
          const toDelete = dk ? allTransactions.filter(t=>t.date===dk) : allTransactions.slice();
          toast('กำลังลบ...');
          for (const t of toDelete){ await deleteWholeTxn(t); }
          toast('ลบข้อมูลแล้ว');
        });
      }, true);
    });
  });
  const closeEdit = document.getElementById('closeEditMode');
  if (closeEdit) closeEdit.addEventListener('click', ()=>{ editDataMode = false; renderSummary(); });

  el.querySelectorAll('[data-sale]').forEach(b=>b.addEventListener('click', ()=>{
    const t = allTransactions.find(x=>x.id===b.dataset.sale);
    if (!t) return;
    openConfirm('ยืนยันการลบ', `เวลา ${t.time} · ${baht(t.total)} — ลบรายการขายนี้ทั้งหมด? สต็อกจะถูกคืนกลับให้อัตโนมัติ`, async ()=>{
      await deleteWholeTxn(t);
      toast('ลบรายการแล้ว');
    });
  }));

  el.querySelectorAll('[data-editsale]').forEach(b=>b.addEventListener('click', ()=>{
    const t = allTransactions.find(x=>x.id===b.dataset.editsale);
    if (!t) return;
    openSaleEditor(t);
  }));
  el.querySelectorAll('[data-se-inc]').forEach(b=>b.addEventListener('click', ()=>{
    const it = editingSaleItems[Number(b.dataset.seInc)];
    if (it) it.qty += 1;
    renderSummary();
  }));
  el.querySelectorAll('[data-se-dec]').forEach(b=>b.addEventListener('click', ()=>{
    const idx = Number(b.dataset.seDec);
    const it = editingSaleItems[idx];
    if (it){ it.qty -= 1; if (it.qty<=0) editingSaleItems.splice(idx,1); }
    renderSummary();
  }));
  el.querySelectorAll('[data-se-pay]').forEach(b=>b.addEventListener('click', ()=>{
    editingSaleMeta.payment = b.dataset.sePay;
    renderSummary();
  }));
  const seStudentCode = document.getElementById('seStudentCode');
  if (seStudentCode) seStudentCode.addEventListener('input', e=>{ editingSaleMeta.studentCode = e.target.value; });
  const seTime = document.getElementById('seTime');
  if (seTime) seTime.addEventListener('input', e=>{ editingSaleMeta.time = e.target.value; });
  const cancelSaleEdit = document.getElementById('cancelSaleEdit');
  if (cancelSaleEdit) cancelSaleEdit.addEventListener('click', ()=>{ editingSaleId=null; editingSaleItems=null; editingSaleMeta=null; renderSummary(); });
  const seAddItem = document.getElementById('seAddItem');
  if (seAddItem) seAddItem.addEventListener('click', ()=>{ openProductPicker(editingSaleItems, ()=>renderSummary()); });
  const seSaveEdit = document.getElementById('seSaveEdit');
  if (seSaveEdit) seSaveEdit.addEventListener('click', ()=>{
    const codeVal = (editingSaleMeta.studentCode||'').trim();
    if (!codeVal){ toast('กรุณากรอกรหัสนักเรียนก่อนบันทึก'); return; }
    openConfirm('ยืนยันการแก้ไข', 'บันทึกการเปลี่ยนแปลงรายการขายนี้? สต็อกจะถูกปรับตามส่วนต่างโดยอัตโนมัติ', async ()=>{
      const t = allTransactions.find(x=>x.id===editingSaleId);
      if (!t) return;
      const finalItems = (editingSaleItems||[]).filter(i=>i.qty>0).map(i=>({...i, subtotal: i.price*i.qty}));
      await applyStockDelta(t.items, finalItems);
      try{
        if (!finalItems.length){
          await deleteDoc(doc(db,'uniform_transactions', t.id));
          toast('ลบรายการแล้ว (ไม่มีสินค้าเหลือ)');
        } else {
          const total = finalItems.reduce((s,i)=>s+i.subtotal,0);
          await updateDoc(doc(db,'uniform_transactions', t.id), {
            items: finalItems, total,
            studentCode: codeVal,
            payment: editingSaleMeta.payment || 'สด',
            time: (editingSaleMeta.time||'').trim() || t.time
          });
          toast('บันทึกการแก้ไขแล้ว');
        }
      }catch(e){
        console.error(e);
        toast('บันทึกไม่สำเร็จ');
      }
      editingSaleId = null; editingSaleItems = null; editingSaleMeta = null;
      renderSummary();
    });
  });
}

function copyDayText(dk){
  const list = allTransactions.filter(t=>t.date===dk).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  if (!list.length){ toast('ไม่มีข้อมูลให้คัดลอก'); return; }
  let lines = [`ยอดขายเครื่องแบบ วันที่ ${dk}`, ''];
  list.forEach(t=>{
    const itemsStr = (t.items||[]).map(it=>`${it.categoryLabel} ไซส์ ${it.size} x${it.qty} = ${baht(it.subtotal)}`).join(', ');
    lines.push(`${t.time} | รหัส ${t.studentCode||'-'} | ${t.seller} | ${t.payment} | ${itemsStr} | รวม ${baht(t.total)}`);
  });
  const total = list.reduce((s,t)=>s+(t.total||0),0);
  lines.push('', `ยอดรวมทั้งสิ้น: ${baht(total)}`);
  navigator.clipboard.writeText(lines.join('\n')).then(()=>toast('คัดลอกแล้ว')).catch(()=>toast('คัดลอกไม่สำเร็จ'));
}

function downloadXlsx(dk){
  const list = allTransactions.filter(t=>t.date===dk).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  if (!list.length){ toast('ไม่มีข้อมูลให้ดาวน์โหลด'); return; }
  // One row per item per transaction (not aggregated) — matches the "ยอดขายเครื่องแบบนักเรียน"
  // table in the financial report: รหัส, ชื่อสินค้า, ไซส์, ราคา, จำนวน, สด, โอน, เวลา
  const rows = [["รหัส","ชื่อสินค้า","ไซส์","ราคา","จำนวน","สด","โอน","เวลา"]];
  let sumCash = 0, sumTransfer = 0;
  list.forEach(t=>{
    (t.items||[]).forEach(it=>{
      const cashAmt = t.payment==='โอน' ? '' : it.subtotal;
      const transferAmt = t.payment==='โอน' ? it.subtotal : '';
      if (t.payment==='โอน') sumTransfer += it.subtotal; else sumCash += it.subtotal;
      rows.push([t.studentCode||'', it.categoryLabel, it.size, it.price, it.qty, cashAmt, transferAmt, t.time]);
    });
  });
  rows.push(["","","","","ยอดเงินรวม", sumCash, sumTransfer, ""]);
  const ws = XLSX.utils.aoa_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, dk);
  XLSX.writeFile(wb, `ยอดขายเครื่องแบบนักเรียน_${dk}.xlsx`);
}

/* ---------------- Stock tab (admin) ---------------- */
function renderStock(){
  const el = document.getElementById('tab-stock');
  if (!adminUnlocked){
    el.innerHTML = `<div class="lock-banner">
      <div class="li">🔒</div>
      <div>ต้องใช้รหัสแอดมินเพื่อแก้ไขสต็อกและราคา</div>
      <p>ใส่รหัสเพื่อแก้ไขจำนวนรับเข้า คงเหลือ และราคา</p>
      <button id="unlockStockBtn">ปลดล็อก</button>
    </div>`;
    document.getElementById('unlockStockBtn').addEventListener('click', ()=>{
      openModal(`
        <h3>เข้าสู่โหมดแอดมิน</h3>
        <input type="password" id="adminCodeInput" class="admin-code-input" placeholder="ใส่รหัส" autocomplete="off">
        <div class="modal-actions">
          <button class="btn-close" id="mCancel">ยกเลิก</button>
          <button class="btn-copy" id="mOk">ยืนยัน</button>
        </div>`);
      document.getElementById('mCancel').addEventListener('click', closeModal);
      const tryLogin = ()=>{
        const v = document.getElementById('adminCodeInput').value;
        if (v === ADMIN_CODE){ adminUnlocked = true; closeModal(); renderStock(); toast('เข้าสู่โหมดแอดมินแล้ว'); }
        else toast('รหัสผ่านไม่ถูกต้อง');
      };
      document.getElementById('mOk').addEventListener('click', tryLogin);
      document.getElementById('adminCodeInput').addEventListener('keydown', e=>{ if (e.key==='Enter') tryLogin(); });
    });
    return;
  }

  let html = `<div class="relock-row"><button class="relock-btn" id="relockBtn">🔒 ล็อกอีกครั้ง</button></div>
    <div class="admin-hint">แก้ไขราคา / จำนวนรับเข้า / คงเหลือ แล้วออกจากช่องเพื่อบันทึกอัตโนมัติ</div>`;

  CATEGORIES.forEach(cat=>{
    const totalRemaining = cat.sizes.reduce((s,size)=> s + ((PRODUCTS[pid(cat.key,size)]||{}).remaining||0), 0);
    html += `<div class="stock-cat">
      <div class="stock-cat-head"><h4>${cat.label} (${cat.sub})</h4><span class="meta">คงเหลือรวม ${totalRemaining}</span></div>`;
    cat.sizes.forEach(size=>{
      const id = pid(cat.key,size);
      const p = PRODUCTS[id] || {price:0, received:0, remaining:0};
      const sold = (p.received||0) - (p.remaining||0);
      html += `<div class="stock-row">
        <div class="info"><div class="n">#${size}</div></div>
        <div class="fields">
          <div class="f"><label>ราคา</label><input type="number" step="0.01" min="0" value="${p.price||0}" data-field="price" data-id="${id}"></div>
          <div class="f"><label>รับเข้า</label><input type="number" min="0" value="${p.received||0}" data-field="received" data-id="${id}"></div>
          <div class="f"><label>คงเหลือ</label><input type="number" value="${p.remaining||0}" data-field="remaining" data-id="${id}"></div>
        </div>
        <div class="sold">ขาย ${sold}</div>
      </div>`;
    });
    html += `</div>`;
  });
  el.innerHTML = html;

  document.getElementById('relockBtn').addEventListener('click', ()=>{ adminUnlocked = false; renderStock(); renderSummaryList(); });
  el.querySelectorAll('input[data-field]').forEach(inp=>{
    inp.addEventListener('change', async e=>{
      const id = e.target.dataset.id;
      const field = e.target.dataset.field;
      let val = parseFloat(e.target.value);
      if (isNaN(val)) val = 0;
      const ref = doc(db,'uniform_products',id);
      if (field==='received'){
        const prev = PRODUCTS[id]?.received || 0;
        const delta = val - prev;
        await updateDoc(ref, { received: val, remaining: increment(delta) });
        toast('อัปเดตจำนวนรับเข้าแล้ว');
      } else if (field==='price'){
        await updateDoc(ref, { price: val });
        toast('อัปเดตราคาแล้ว');
      } else if (field==='remaining'){
        await updateDoc(ref, { remaining: val });
        toast('อัปเดตจำนวนคงเหลือแล้ว');
      }
    });
  });
}

/* ---------------- Modal ---------------- */
function openModal(innerHtml){
  let back = document.getElementById('modalBack');
  if (!back){
    back = document.createElement('div');
    back.id = 'modalBack';
    back.className = 'modal-back';
    document.body.appendChild(back);
  }
  back.innerHTML = `<div class="modal">${innerHtml}</div>`;
  back.classList.add('open');
  back.style.display = 'flex';
  back.addEventListener('click', e=>{ if (e.target===back) closeModal(); });
}
function closeModal(){
  const back = document.getElementById('modalBack');
  if (back) back.style.display = 'none';
}

/* ---------------- Init ---------------- */
(async function init(){
  renderSell();
  try{
    await readyPromise;
    await ensureSeeded();
    listenProducts();
    listenSellers();
    listenTransactions();
  }catch(err){
    console.error(err);
    toast('เชื่อมต่อ Firebase ไม่สำเร็จ');
  }
})();
</script>
